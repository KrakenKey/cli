version: 2

project_name: krakenkey

before:
  hooks:
    - go mod tidy

builds:
  - id: krakenkey
    main: ./cmd/krakenkey
    binary: krakenkey
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: krakenkey
    name_template: "krakenkey_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

dockers_v2:
  - images:
      - "ghcr.io/krakenkey/cli"
    dockerfile: Dockerfile.goreleaser
    tags:
      - "v{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'
